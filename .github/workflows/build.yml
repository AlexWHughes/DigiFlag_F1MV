# Run the app build (electron-vite) on push and PR to verify it compiles.
# For full installers and GitHub Releases, push a version tag (e.g. v2.8.6) to trigger the Release workflow.
name: Build
on:
  push:
    branches: [stable, main]
  pull_request:
    branches: [stable, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
